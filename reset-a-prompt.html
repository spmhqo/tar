<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Reset A Prompt</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .document-container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }
        .doc-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }
        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }
        .doc-subtitle { font-size: 0.95rem; color: var(--text-muted); font-weight: 400; }
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 36px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }
        .prompt-card {
            margin: 0 0 20px;
            padding: 20px;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }
        .prompt-card:last-child { margin-bottom: 0; }
        .input-group { margin-bottom: 20px; }
        .input-group:last-child { margin-bottom: 0; }
        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .input-example {
            display: block;
            color: var(--text-muted);
            font-size: 0.82rem;
            font-weight: 400;
            margin-top: 3px;
        }
        .doc-input {
            display: block;
            width: 100%;
            min-height: 120px;
            padding: 12px 16px;
            font: 400 0.95rem/1.6 var(--font-sans);
            color: var(--text-main);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .doc-input:focus, .prompt-preview:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }
        .output-card {
            margin-top: 30px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .output-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }
        .prompt-preview {
            display: block;
            width: 100%;
            min-height: 380px;
            padding: 16px;
            margin-bottom: 16px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font: 400 0.9rem/1.6 var(--font-sans);
            resize: vertical;
            white-space: pre-wrap;
        }
        .copy-btn {
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 10px 20px;
            font: 500 0.85rem var(--font-sans);
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn:focus-visible { outline: 3px solid rgba(67, 56, 202, 0.35); outline-offset: 2px; }
        .copy-btn.copied { background: var(--success); }
        .doc-footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 24px 16px; }
            .doc-title { font-size: 1.8rem; }
            .prompt-card { padding: 14px; }
            .output-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Reset A Prompt</h1>
            <p class="doc-subtitle">(in accordance with the operating system)</p>
        </header>

        <section aria-labelledby="inputs-heading">
            <h2 id="inputs-heading" class="section-heading">1. Variables &amp; Inputs</h2>

            <div class="prompt-card">
                <div class="input-group">
                    <label class="input-label" for="question">QUESTION:
                        <span class="input-example">Input Example: Instead of the salespage or sales material, I want to upload the digital product itself, I am to sell as I am its creator and owner, what will happen?</span>
                    </label>
                    <textarea id="question" class="doc-input" placeholder="[Insert Question Here]" oninput="updatePrompt()" spellcheck="true"></textarea>
                </div>
            </div>

            <div class="prompt-card">
                <div class="input-group">
                    <label class="input-label" for="promptToRepurpose">Prompt to Repurpose:</label>
                    <textarea id="promptToRepurpose" class="doc-input" placeholder="[Insert Prompt Here]" oninput="updatePrompt()" spellcheck="true"></textarea>
                </div>
            </div>
        </section>

        <section aria-labelledby="output-heading">
            <h2 id="output-heading" class="section-heading">2. Generated Output Prompt</h2>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">Live Prompt Preview</span>
                </div>
                <textarea id="promptOutput" class="prompt-preview" aria-label="Live prompt preview" readonly></textarea>
                <button class="copy-btn" type="button" onclick="copyPrompt()">Copy to Clipboard</button>
            </div>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const template = `Answer the following prompt in Bengali (India).

Rules:
- Use only Bengali (India).
- Always address the reader as "আপনি".
- Never use "তুমি" or "তুই".
- Use a natural Kolkata-style conversational tone.
- Use natural, modern Bengali (India).
- Avoid Bangladeshi vocabulary, spelling, and expressions.

PROMPT

Review this prompt below and answer the following question.

QUESTION:

{QUESTION}

PROMPT:

{PROMPT}`;

        function updatePrompt() {
            const question = document.getElementById('question').value;
            const promptToRepurpose = document.getElementById('promptToRepurpose').value;
            document.getElementById('promptOutput').value = template
                .replace('{QUESTION}', question)
                .replace('{PROMPT}', promptToRepurpose);
        }

        async function copyPrompt() {
            const output = document.getElementById('promptOutput');
            const button = document.querySelector('.copy-btn');
            try {
                await navigator.clipboard.writeText(output.value);
            } catch (error) {
                output.focus();
                output.select();
                document.execCommand('copy');
                output.setSelectionRange(0, 0);
            }
            const originalText = button.textContent;
            button.textContent = '✓ Copied!';
            button.classList.add('copied');
            window.setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('copied');
            }, 2000);
        }

        window.addEventListener('DOMContentLoaded', updatePrompt);
    </script>
</body>
</html>
