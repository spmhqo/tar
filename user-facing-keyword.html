<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User-Facing Keyword</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }
        .document-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }
        .doc-header {
            text-align: center;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 28px;
        }
        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }
        .doc-subtitle { font-size: 0.95rem; color: var(--text-muted); font-weight: 400; }
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 30px 0 14px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }
        .input-group { margin-bottom: 20px; }
        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .doc-input, .prompt-preview {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            line-height: 1.6;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .doc-input {
            min-height: 76px;
            background: var(--bg-color);
            resize: none;
            overflow: hidden;
        }
        .doc-input:focus, .prompt-preview:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }
        .output-card {
            margin-top: 18px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 22px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .output-title {
            font-family: var(--font-serif);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }
        .prompt-preview {
            display: block;
            min-height: 160px;
            background: var(--surface-color);
            border-radius: 6px;
            resize: vertical;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .copy-btn {
            flex: 0 0 auto;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn:active { transform: translateY(1px); }
        .copy-btn.copied { background: var(--success); }
        .doc-footer {
            text-align: center;
            margin-top: 46px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 24px 16px; }
            .doc-title { font-size: 1.8rem; }
            .output-card { padding: 16px; }
            .output-header { align-items: flex-start; flex-direction: column; }
            .copy-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">User-Facing Keyword</h1>
            <p class="doc-subtitle">(for prompt bundle)</p>
        </header>

        <section aria-labelledby="input-heading">
            <h2 id="input-heading" class="section-heading">Central Topic</h2>
            <div class="input-group">
                <label class="input-label" for="topicInput">Central Topic:</label>
                <textarea id="topicInput" class="doc-input" placeholder="[Write the Central Topic]" aria-label="Central Topic" rows="2"></textarea>
            </div>
        </section>

        <section aria-labelledby="prompt-heading">
            <h2 id="prompt-heading" class="section-heading">Prompt</h2>
            <div class="output-card">
                <div class="output-header">
                    <span class="output-title">Generated Prompt</span>
                    <button class="copy-btn" type="button" id="copyButton">Copy Prompt</button>
                </div>
                <textarea id="promptOutput" class="prompt-preview" readonly aria-label="Generated prompt"></textarea>
            </div>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const promptTemplate = `AI prompts for {TOPIC}.`;

        const topicInput = document.getElementById('topicInput');
        const promptOutput = document.getElementById('promptOutput');
        const copyButton = document.getElementById('copyButton');

        function updatePrompt() {
            const topic = topicInput.value || '[Write the Central Topic]';
            promptOutput.value = promptTemplate.replace('{TOPIC}', topic);
        }

        function resizeInput() {
            topicInput.style.height = 'auto';
            topicInput.style.height = `${Math.max(76, topicInput.scrollHeight)}px`;
        }

        async function copyPrompt() {
            try {
                await navigator.clipboard.writeText(promptOutput.value);
            } catch (error) {
                promptOutput.focus();
                promptOutput.select();
                document.execCommand('copy');
                promptOutput.setSelectionRange(0, 0);
            }
            const originalText = copyButton.textContent;
            copyButton.textContent = '✓ Copied!';
            copyButton.classList.add('copied');
            window.setTimeout(() => {
                copyButton.textContent = originalText;
                copyButton.classList.remove('copied');
            }, 2000);
        }

        topicInput.addEventListener('input', () => {
            updatePrompt();
            resizeInput();
        });
        copyButton.addEventListener('click', copyPrompt);
        updatePrompt();
        resizeInput();
    </script>
</body>
</html>
