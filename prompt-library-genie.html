<style>
:root{--bg:#faf9f6;--surface:#fff;--border:#e2dfdc;--focus:#706b63;--text:#2c2a29;--muted:#6e6963;--accent:#1a1918;--success:#2e7d32;--header:#4338ca;--serif:'Newsreader',serif;--sans:'Plus Jakarta Sans',sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;padding:40px 20px;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}.container{max-width:900px;margin:0 auto;padding:44px 40px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 24px #00000005}.header{text-align:center;margin-bottom:32px;padding-bottom:26px;border-bottom:1px solid var(--border)}h1{margin:0 0 4px;font:600 2.2rem var(--serif);letter-spacing:-.02em;color:var(--header)}.subtitle{color:var(--muted);font-size:.96rem}.section-title{margin:30px 0 14px;padding-bottom:8px;border-bottom:1px dashed var(--border);font:600 1.35rem var(--serif)}.input-label{display:block;margin:0 0 8px;font-size:.92rem;font-weight:600}.dynamic-input{width:100%;min-height:125px;resize:vertical;padding:14px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:400 .95rem/1.6 var(--sans)}.dynamic-input:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px #706b631a}.hint{margin:7px 0 0;color:var(--muted);font-size:.82rem}.prompt-card{margin:18px 0;padding:20px;background:var(--bg);border:1px solid var(--border);border-radius:10px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.prompt-name{font:600 1.2rem var(--serif);margin:0}.prompt-text{width:100%;min-height:170px;resize:vertical;padding:14px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font:400 .88rem/1.55 var(--sans);white-space:pre-wrap}.copy-btn{flex:none;padding:9px 15px;border:0;border-radius:6px;background:var(--accent);color:white;font:500 .84rem var(--sans);cursor:pointer}.copy-btn:hover{background:#383532}.copy-btn.copied{background:var(--success)}.footer{text-align:center;margin-top:40px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:.84rem}@media(max-width:640px){body{padding:12px 8px}.container{padding:25px 16px}h1{font-size:1.85rem}.prompt-card{padding:14px}.card-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="container"><header class="header"><h1>Prompt Library Genie</h1><p class="subtitle">(for students)</p></header>
<section><h2 class="section-title">Keyword and input</h2><label class="input-label" for="keywordInput">Keyword and input</label><textarea id="keywordInput" class="dynamic-input" placeholder="আপনার keyword ও প্রয়োজনীয় তথ্য এখানে লিখুন…" oninput="updatePrompts()"></textarea><p class="hint">এই ইনপুটের লেখা সাতটি প্রম্পটের [Keyword and input] অংশে বসবে।</p></section>
<section><h2 class="section-title">Prompt Library</h2><div id="promptList"></div></section>
<footer class="footer">Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</footer></main>
<script>
const promptBodies = ["Answer the following prompt in Bengali (India).\n\nRules:\n- Use only Bengali (India).\n- Always address the reader as \"আপনি\".\n- Never use \"তুমি\" or \"তুই\".\n- Use a natural Kolkata-style conversational tone.\n- Use natural, modern Bengali (India).\n- Avoid Bangladeshi vocabulary, spelling, and expressions.\n\nPROMPT\n\nYou are an expert learning-system designer, instructional designer, educational strategist, learner-experience designer, and AI prompt engineer.\n\nYour task is to create a comprehensive, coherent, high-quality library of ready-to-use AI prompts based only on the user-provided inputs.\n\nIMPORTANT OPERATING PRINCIPLE\n\nThe user will provide only the information they are reasonably able to provide.\n\nDo not increase the user's manual-input burden by asking for additional information merely because some context is missing.\n\nInstead, use your own analysis, contextual inference, checking, balancing, gap detection, and quality-control mechanisms to compensate for limitations in the input.\n\nWhen information is missing:\n\n- infer only what is reasonably supported by the provided information\n- use sensible, conservative assumptions when necessary\n- clearly distinguish reasonable inference from explicit information\n- do not invent unsupported facts\n- do not ask unnecessary clarification questions\n- do not reduce the quality or usefulness of the final output simply because the input is incomplete\n\nThe goal is to make the best possible learning prompt library from the information available.\n\nUSER INPUT\n\n[Keyword and input]\n\nLearning Goal / Context:\nSelf-learning for school subjects and examination preparation.\n\nPHASE 1 — UNDERSTAND THE REQUEST\n\nFirst analyse the provided Keyword, Intent, and Learning Goal / Context.\n\nDetermine from them, as far as reasonably possible:\n\n- who the intended learner is\n- what the learner is trying to accomplish\n- what kind of learning situation is involved\n- what role AI is expected to play\n- what kind of learning material or content is likely to be involved\n- what level of interaction the learner is likely to need\n- what the learner ultimately needs to be able to understand, remember, apply, or demonstrate\n\nDo not create prompts yet.\n\nDo not ask the user to supply these details separately.\n\nInfer them from the available information wherever reasonably possible.\n\nPHASE 2 — MODEL THE LEARNER JOURNEY\n\nConstruct an internal model of the learner's journey from the learner's likely starting point to the desired learning outcome.\n\nConsider the complete learning process, including where relevant:\n\n- orientation and understanding what needs to be learned\n- activating prior knowledge\n- identifying prerequisites\n- understanding the structure of the learning material\n- understanding basic concepts\n- understanding difficult concepts\n- learning terminology and definitions\n- understanding relationships between concepts\n- identifying important information\n- asking and answering questions\n- explaining ideas independently\n- practising retrieval\n- applying knowledge\n- comparing related concepts\n- solving problems\n- interpreting diagrams or other representations\n- receiving feedback\n- identifying errors\n- correcting misconceptions\n- strengthening weak areas\n- revising\n- retaining knowledge\n- assessing progress\n- preparing for examinations or other performance situations\n- evaluating mastery\n- deciding what to learn or practise next\n\nThis is a discovery process, not a checklist.\n\nDo not assume every learning function is necessary.\n\nIdentify only the functions that are genuinely relevant to the user's context.\n\nPHASE 3 — DISCOVER LEARNING TASKS\n\nFrom the learner journey, discover the distinct learning tasks that an AI learning assistant could meaningfully perform.\n\nThe examples below are reference signals only. They are NOT a fixed list, required number, or final taxonomy.\n\nReference examples:\n\n- chapter understanding\n- difficult concept explanation\n- paragraph learning\n- concept mapping\n- identifying important information\n- question and answer\n- independent answering\n- terms and definitions\n- comparison\n- diagram-based learning\n- revision\n- misconception correction\n- personal tutoring\n- answer evaluation\n- complete learning session\n- learning sequence\n- active recall\n- spaced revision\n- exam simulation\n\nUse these examples to understand the intended direction.\n\nThen independently discover additional learning tasks wherever they provide genuine value.\n\nPossible additional functions may include, but are not limited to:\n\n- prerequisite checking\n- prior-knowledge assessment\n- example generation\n- counterexample generation\n- analogy-based explanation\n- cause-and-effect reasoning\n- process sequencing\n- application practice\n- guided problem solving\n- hint-based assistance\n- teach-back\n- error diagnosis\n- weak-area diagnosis\n- adaptive explanation\n- memory support\n- retrieval practice\n- progressive practice\n- exam-style question generation\n- answer improvement\n- mastery assessment\n\nDo not assume these examples are complete either.\n\nThe final task set must emerge from the actual learner journey.\n\nPHASE 4 — DISTINGUISH LEARNING FUNCTIONS\n\nFor every candidate learning task, determine:\n\n1. What specific learning problem does it solve?\n2. What does the learner do through this task?\n3. What does the AI do?\n4. What learning outcome does it produce?\n5. Is the function genuinely distinct from the other tasks?\n6. Does it deserve a dedicated prompt?\n\nDo not create a separate prompt merely because:\n\n- the wording is different\n- the output format is different\n- the same task is applied to a different topic\n- one prompt can easily handle the function as part of another prompt\n\nCreate a separate prompt only when the learning mechanism, learner activity, AI role, or intended outcome is meaningfully different.\n\nPHASE 5 — REMOVE OVERLAP\n\nCompare all discovered learning tasks.\n\nDetect:\n\n- duplicate functions\n- near-duplicates\n- unnecessary subdivisions\n- redundant prompt ideas\n- prompts whose functions can be effectively combined\n\nMerge overlapping tasks where appropriate.\n\nKeep distinct tasks separate when combining them would reduce clarity, usability, learner engagement, or learning effectiveness.\n\nOptimise for meaningful coverage, not maximum prompt count.\n\nPHASE 6 — IDENTIFY MISSING FUNCTIONS\n\nAfter removing overlap, perform a deliberate gap analysis.\n\nAsk:\n\n\"What important learning job could still be missing from this system?\"\n\nCheck the learner journey for gaps across:\n\n- understanding\n- comprehension\n- prerequisite knowledge\n- active participation\n- practice\n- application\n- retrieval\n- feedback\n- error correction\n- misconception correction\n- memory\n- retention\n- adaptation\n- assessment\n- examination preparation\n- mastery\n- progression\n\nAlso consider the specific subject, learner, learning context, and intent inferred from the user's input.\n\nIf a meaningful gap is found, add the missing learning task.\n\nRepeat the overlap and gap checks until the task set is sufficiently complete and balanced.\n\nPHASE 7 — BUILD THE LEARNING ARCHITECTURE\n\nOrganise the final learning tasks into a coherent structure.\n\nDo not force them into predetermined categories.\n\nCreate categories that naturally emerge from the discovered learning functions and learner journey.\n\nWhere appropriate, distinguish between:\n\n- understanding\n- active learning\n- practice\n- feedback\n- memory and retention\n- assessment\n- mastery\n\nBut create different or additional categories when the context requires them.\n\nArrange the tasks in a logical learning progression where useful.\n\nA learner should be able to understand:\n\n- what each prompt does\n- when to use it\n- which learning problem it solves\n- how it relates to other prompts\n- whether it can be used independently or as part of a sequence\n\nDo not force every prompt into a single linear sequence.\n\nPHASE 8 — DESIGN THE PROMPTS\n\nCreate one ready-to-use AI prompt for each validated learning task.\n\nEach prompt must:\n\n- perform one clearly defined learning function\n- be directly copy-pasteable\n- be beginner-friendly\n- use clear and natural language\n- be appropriate for the inferred learner\n- be appropriate for the inferred learning context\n- make effective use of the learner's available learning material\n- encourage active participation whenever appropriate\n- support interaction when interaction improves learning\n- avoid unnecessary prompt-engineering terminology\n- avoid requiring advanced AI knowledge\n- produce a meaningful learning outcome\n- be clearly distinct from every other prompt\n\nDo not make every prompt behave in the same way.\n\nUse the most appropriate interaction model for each learning task.\n\nExamples include:\n\n- explanation\n- guided questioning\n- Socratic questioning\n- retrieval practice\n- independent answering\n- practice\n- feedback\n- diagnosis\n- correction\n- comparison\n- application\n- simulation\n- revision\n- assessment\n- adaptive tutoring\n\nPHASE 9 — MAKE THE PROMPTS SELF-CONTAINED\n\nWhenever possible, each generated prompt should contain enough instructions for a beginner to use it without needing to understand the larger system.\n\nWhere input from the learner is required, clearly indicate it inside the prompt using simple placeholders.\n\nFor example:\n\n[Topic]\n\n[Chapter]\n\n[Learning Material]\n\n[Question]\n\n[My Answer]\n\nDo not create unnecessary input fields.\n\nThe learner should provide only information that is genuinely necessary for that particular prompt.\n\nPHASE 10 — DESIGN THE LIBRARY AS A SYSTEM\n\nThe prompts must work at two levels:\n\nLEVEL 1 — Individual Use\n\nA learner should be able to select one prompt for a specific learning need and use it independently.\n\nLEVEL 2 — Systematic Learning\n\nThe prompts should also work together as a coherent learning system.\n\nWhere useful, show logical relationships such as:\n\nUnderstand → Practise → Recall → Apply → Evaluate → Improve\n\nBut do not impose this exact sequence on every subject or learner.\n\nThe final architecture must remain flexible.\n\nPHASE 11 — QUALITY AND BALANCE AUDIT\n\nBefore presenting the final library, perform a full internal audit.\n\nCheck:\n\n1. Did the input provide enough information to understand the core intent?\n2. Were reasonable inferences used where information was missing?\n3. Were unnecessary assumptions avoided?\n4. Were unnecessary clarification requests avoided?\n5. Were important learning functions discovered beyond the reference examples?\n6. Were overlapping functions merged?\n7. Were important missing functions added?\n8. Does every prompt have a distinct learning purpose?\n9. Does every prompt contribute meaningful learning value?\n10. Are there redundant prompts?\n11. Is the learner asked to actively participate where appropriate?\n12. Are passive information-delivery prompts avoided where active learning would be more effective?\n13. Does the library support understanding, practice, retention, assessment, and improvement where relevant?\n14. Does it reflect the specific learner and learning context?\n15. Is the language appropriate for the intended learner?\n16. Are the prompts genuinely copy-paste-ready?\n17. Are unnecessary input requirements avoided?\n18. Does the library feel like one coherent learning system rather than a random collection of prompts?\n\nIf any problem is found, revise the task set or prompts before producing the final answer.\n\nFINAL OUTPUT\n\nPresent the final result in this structure:\n\n1. Learning Context\nBriefly state your understanding of the learner, learning goal, and learning situation based on the provided input.\n\n2. Learner Journey\nShow the major stages of the learner's journey.\n\n3. Discovered Learning Task Map\nList the final distinct learning functions discovered after analysis, overlap removal, and gap analysis.\n\n4. Learning Architecture\nGroup the tasks into logical categories and briefly explain the role of each category.\n\n5. Complete AI Learning Prompt Library\nFor every prompt, use this format:\n\nPrompt [Number]: [Short Name]\n\nLearning Function:\n[What specific learning job this prompt performs.]\n\nPurpose:\n[What the learner will achieve.]\n\nUse When:\n[When the learner should use it.]\n\nReady-to-Use Prompt:\n[Complete copy-paste-ready prompt.]\n\nExpected Learning Outcome:\n[What the learner should understand, remember, do, or improve.]\n\n6. How to Use the Library\nBriefly explain how a beginner can use the prompts individually and how they can combine them into a complete learning process.\n\n7. Final Quality Check\nBriefly summarise how the final library was checked for overlap, missing functions, balance, distinctiveness, usability, and coherence.\n\nIMPORTANT FINAL RULES\n\nDo not optimise for a predetermined number of prompts.\n\nDo not treat the reference examples as a fixed taxonomy.\n\nDo not add prompts simply to make the library appear comprehensive.\n\nDo not remove genuinely useful learning functions merely to keep the library short.\n\nDo not increase the user's manual-input burden.\n\nUse analysis, inference, checking, balancing, overlap detection, gap analysis, and quality control to compensate for limitations in the user's input.\n\nThe final number of prompts must be determined by the actual learning needs discovered from the user's input.\n\nThe final result should be comprehensive enough to cover the learner's meaningful needs, but disciplined enough to avoid redundancy.\n\nDo not reveal hidden chain-of-thought or private reasoning. Provide the conclusions, classifications, decisions, and useful analysis needed to make the output understandable and actionable.", "আমার ধারণা এটা under delivery হ'ল - act as a learner and review the deficiencies in this prompt library", "আগে আমাকে এই রিভিউ অনুযায়ী নতুন লাইব্রেরীতে কোন কোন প্রম্পট রাখবে ও সেগুলোর কাজ কি হবে তার চূড়ান্ত লিস্টটা দাও. Ensure that the “Prompt Library” must turn into a “Learning System”", "Act as a learner using these prompts and review whether each prompt can function as a standalone, reusable prompt template without depending on the other prompts, considering the practical reality that the entire prompt library cannot be used together every time.", "প্রম্পটগুলোকে technically sound করার জন্য promptগুলোকে দীর্ঘ ও জটিল করতে যেয়ো না, এমনিতেই ইউজাররা এ আই কে ভয় পাই, তাতে আবার technicality-র জটিলতার ফাঁদে পড়লে ওরা আরও বেশি করে ভয় পাবে ও আড়ষ্ট হয়ে পড়বে", "এবার প্রম্পটগুলো লেখো", "Give me all these prompts with their respective serial numbers and names, categorized and presented together in a single Markdown code box, without using symbols such as \"#\" or \"*\"."];
function escapeText(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function updatePrompts(){const input=document.getElementById('keywordInput').value;const host=document.getElementById('promptList');host.innerHTML='';promptBodies.forEach((body,i)=>{const text=body.replaceAll('[Keyword and input]',input || '[Keyword and input]');const card=document.createElement('article');card.className='prompt-card';card.innerHTML='<div class="card-head"><h3 class="prompt-name">Prompt#'+(i+1)+'</h3><button class="copy-btn" type="button">Copy prompt</button></div><textarea class="prompt-text" readonly aria-label="Prompt '+(i+1)+'"></textarea>';card.querySelector('textarea').value=text;card.querySelector('button').addEventListener('click',()=>copyPrompt(card.querySelector('textarea'),card.querySelector('button')));host.appendChild(card)})}
async function copyPrompt(field,button){try{await navigator.clipboard.writeText(field.value)}catch(e){field.focus();field.select();document.execCommand('copy');field.setSelectionRange(0,0)}const old=button.textContent;button.textContent='Copied!';button.classList.add('copied');setTimeout(()=>{button.textContent=old;button.classList.remove('copied')},1800)}
updatePrompts();
</script></body></html>
