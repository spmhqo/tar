<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Bundle Genie (Digital Product)</title>
    <link rel="icon" href="spm.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f6;
            --surface-color: #ffffff;
            --border-color: #e2dfdc;
            --border-focus: #706b63;
            --text-main: #2c2a29;
            --text-muted: #6e6963;
            --accent: #1a1918;
            --accent-hover: #383532;
            --success: #2e7d32;
            --header-color: #4338ca;
            --font-serif: 'Newsreader', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .document-container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02);
        }

        .doc-header {
            text-align: center;
            margin-bottom: 36px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
        }

        .doc-title {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--header-color);
            margin-bottom: 8px;
        }

        .doc-subtitle { font-size: 0.95rem; color: var(--text-muted); font-weight: 400; }
        .section-heading {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
            margin: 30px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px dashed var(--border-color);
        }

        .input-group { margin-bottom: 18px; }
        .input-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .doc-input {
            width: 100%;
            min-height: 92px;
            padding: 12px 16px;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            resize: vertical;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .doc-input:focus {
            outline: none;
            border-color: var(--border-focus);
            background: var(--surface-color);
            box-shadow: 0 0 0 3px rgba(112, 107, 99, 0.1);
        }

        .prompt-list { display: grid; gap: 18px; }
        .prompt-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 22px;
        }

        .prompt-heading {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .prompt-preview {
            width: 100%;
            min-height: 180px;
            padding: 16px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text-main);
            resize: vertical;
            white-space: pre-wrap;
        }

        .copy-btn {
            margin-top: 14px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .copy-btn:hover { background: var(--accent-hover); }
        .copy-btn.copied { background: var(--success); }
        .copy-btn:focus-visible { outline: 3px solid rgba(67, 56, 202, 0.35); outline-offset: 2px; }

        .doc-footer {
            text-align: center;
            margin-top: 42px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        @media (max-width: 640px) {
            body { padding: 12px 8px; }
            .document-container { padding: 24px 16px; }
            .doc-title { font-size: 1.8rem; }
            .prompt-card { padding: 16px; }
        }
    </style>
</head>
<body>
    <main class="document-container">
        <header class="doc-header">
            <h1 class="doc-title">Prompt Bundle Genie</h1>
            <p class="doc-subtitle">(Digital Product)</p>
        </header>

        <section aria-labelledby="inputs-heading">
            <h2 class="section-heading" id="inputs-heading">Variables &amp; Inputs</h2>
            <div class="input-group">
                <label class="input-label" for="inputKeyword">Keyword:</label>
                <textarea id="inputKeyword" class="doc-input" placeholder="Enter keyword..." oninput="updatePrompts()">[Keyword]</textarea>
            </div>
            <div class="input-group">
                <label class="input-label" for="inputIntent">Intent:</label>
                <textarea id="inputIntent" class="doc-input" placeholder="Enter intent..." oninput="updatePrompts()">[Intent]</textarea>
            </div>
        </section>

        <section aria-labelledby="prompts-heading">
            <h2 class="section-heading" id="prompts-heading">Generated Prompts</h2>
            <div class="prompt-list">
                <article class="prompt-card">
                    <h3 class="prompt-heading">Prompt#1</h3>
                    <textarea id="promptOutput1" class="prompt-preview" readonly aria-label="Prompt 1 output"></textarea>
                    <button class="copy-btn" type="button" data-output="promptOutput1">Copy Prompt#1</button>
                </article>

                <article class="prompt-card">
                    <h3 class="prompt-heading">Prompt#2</h3>
                    <textarea id="promptOutput2" class="prompt-preview" readonly aria-label="Prompt 2 output"></textarea>
                    <button class="copy-btn" type="button" data-output="promptOutput2">Copy Prompt#2</button>
                </article>
            </div>
        </section>

        <footer class="doc-footer">
            Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.
        </footer>
    </main>

    <script>
        const prompt1Template = `Keyword: [Keyword]

Intent: [Intent]

TASK

Create a set of ready-to-use, user-facing prompts that I can package and sell as a prompt bundle.

RULES (MANDATORY)

1. The prompts must be genuinely useful to both buyers and end users.
2. Each prompt must be written as a user-facing prompt that the buyer can read, copy, paste into ChatGPT, and use directly.
3. Do not create generic prompts that could apply to almost any English-learning situation.
4. Each prompt must address a specific, meaningful need within the search intent represented by the keyword.
5. Each prompt must produce a practical outcome that the user can actually use for English speaking practice with ChatGPT.
6. The prompts should collectively cover the important practical needs of someone who wants to use ChatGPT as a speaking-practice partner.
7. Prioritise usefulness, specificity, and real-world application over the number of prompts.
8. Do not create prompts merely to increase the number of prompts in the bundle. Every prompt must earn its place by addressing a distinct and genuine user need.`;

        const prompt2Template = `Write a short, direct, and to-the-point, user-facing how-to guide explaining how to quickly set up the mechanism required for this job.`;

        function updatePrompts() {
            const keyword = document.getElementById('inputKeyword').value;
            const intent = document.getElementById('inputIntent').value;
            const replaceValues = (template) => template
                .replaceAll('[Keyword]', keyword)
                .replaceAll('[Intent]', intent);

            document.getElementById('promptOutput1').value = replaceValues(prompt1Template);
            document.getElementById('promptOutput2').value = replaceValues(prompt2Template);
        }

        document.querySelectorAll('.copy-btn').forEach((button) => {
            button.addEventListener('click', async () => {
                const output = document.getElementById(button.dataset.output);
                const originalText = button.textContent;

                try {
                    await navigator.clipboard.writeText(output.value);
                } catch (error) {
                    output.focus();
                    output.select();
                    document.execCommand('copy');
                }

                button.textContent = '✓ Copied!';
                button.classList.add('copied');
                window.setTimeout(() => {
                    button.textContent = originalText;
                    button.classList.remove('copied');
                }, 2000);
            });
        });

        window.addEventListener('DOMContentLoaded', updatePrompts);
    </script>
</body>
</html>
